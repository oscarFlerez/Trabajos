<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agente - Consultas sobre licitaciones</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         background: #eef2f4; height: 100vh; display: flex; flex-direction: column; color: #1a1a1a; }
  .cab { background: #0b3d5c; color: #fff; padding: 12px 15px; }
  .cab h1 { margin: 0; font-size: 16px; }
  .cab a { color: #b9d4e4; font-size: 12.5px; }
  .cab .sub { font-size: 11.5px; opacity: .85; margin-top: 2px; }
  .ctxwrap { max-width: 860px; margin: 12px auto 0; width: calc(100% - 24px); }
  details.ctx { background: #fff; border: 1px solid #d5dfe5; border-radius: 7px; }
  details.ctx summary { padding: 11px 14px; cursor: pointer; color: #0b3d5c; font-size: 13.5px; font-weight: 600; }
  details.ctx pre { margin: 0; padding: 0 14px 14px; font-size: 11.5px; line-height: 1.55;
                     white-space: pre-wrap; color: #475569; max-height: 260px; overflow: auto; }
  .hilo { flex: 1; overflow-y: auto; padding: 16px 14px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { max-width: 88%; padding: 11px 14px; border-radius: 9px; margin-bottom: 12px;
         line-height: 1.6; white-space: pre-wrap; font-size: 15px; }
  .msg.yo { background: #0b3d5c; color: #fff; margin-left: auto; }
  .msg.ia { background: #fff; border: 1px solid #dbe3e8; }
  .msg.aviso { max-width: 100%; background: #fff8e6; border: 1px solid #e8c877; font-size: 13.5px; }
  .escribiendo { color: #94a3b8; font-style: italic; }
  .pie { background: #fff; border-top: 1px solid #d5dfe5; padding: 10px 12px; }
  .forma { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; border: 1px solid #cbd5e1; border-radius: 7px; padding: 10px 12px;
             font-size: 15px; resize: none; height: 46px; font-family: inherit; }
  button { background: #0b3d5c; color: #fff; border: none; border-radius: 7px;
           padding: 0 18px; font-size: 15px; font-weight: 600; }
  button:disabled { background: #94a3b8; }
  .opc { max-width: 860px; margin: 0 auto 8px; display: flex; gap: 12px; font-size: 12.5px;
         color: #64748b; align-items: center; flex-wrap: wrap; }
  .ejemplos { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 7px; padding: 0 12px 8px; }
  .ej { background: #fff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 6px 12px;
        font-size: 12.5px; cursor: pointer; }
  @media (max-width: 600px) { .opc { padding: 0 12px; } }
</style>
</head>
<body>

<div class="cab">
  <h1>Agente</h1>
  <div class="sub">IA gratuita con cuenta de Puter &middot; <a href="index.html">&larr; Volver</a></div>
</div>

<details class="ctxwrap ctx">
  <summary>Que se le dice al agente (contexto completo)</summary>
  <pre id="ctx"></pre>
</details>

<div class="opc">
  <label><input type="checkbox" id="incog" checked> Incognito: no guardar esta conversacion</label>
  <label style="margin-left:auto">Modelo:
    <select id="modelo">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option>
      <option value="claude-sonnet-4">claude-sonnet-4</option>
      <option value="deepseek-chat">deepseek-chat</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    </select>
  </label>
</div>

<div class="hilo" id="hilo"></div>

<div class="ejemplos" id="ejemplos">
  <div class="ej">Cuales son las trampas de estos datos?</div>
  <div class="ej">Como filtro oportunidades de construccion?</div>
  <div class="ej">Que campos sirven y cuales no?</div>
  <div class="ej">Como compenso que no haya fecha de cierre?</div>
</div>

<div class="pie">
  <div class="forma">
    <textarea id="entrada" placeholder="Escribi tu consulta..."></textarea>
    <button id="enviar">Enviar</button>
  </div>
</div>

<script type="module">
import { CONTEXTO } from "./contexto.js";
document.getElementById("ctx").textContent = CONTEXTO;

const hilo = document.getElementById("hilo");
const entrada = document.getElementById("entrada");
const boton = document.getElementById("enviar");
let historial = [];      // solo en la memoria de esta pestana
let cargando = false;

const av = document.createElement("div");
av.className = "msg aviso";
av.textContent = "Para responder, Puter pide una cuenta gratuita (una vez, con Google o correo). "
  + "NO es un servicio anonimo: el incognito de este navegador no lo cambia, porque la "
  + "peticion sale identificada hacia Puter. Lo que si es cierto: esta conversacion no se "
  + "guarda en ningun archivo ni en ningun servidor nuestro, y se pierde al cerrar la pestana. "
  + "Aun asi, la pregunta viaja por internet: no escribas datos que no quieras que salgan del equipo.";
hilo.appendChild(av);

function burbuja(t, c) { const d = document.createElement("div"); d.className = "msg " + c;
  d.textContent = t; hilo.appendChild(d); hilo.scrollTop = hilo.scrollHeight; return d; }

document.getElementById("ejemplos").addEventListener("click", e => {
  if (e.target.classList.contains("ej")) { entrada.value = e.target.textContent; entrada.focus(); }
});
entrada.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); mandar(); } });
boton.addEventListener("click", mandar);

async function mandar() {
  if (cargando) return;
  const texto = entrada.value.trim();
  if (!texto) return;
  entrada.value = "";
  burbuja(texto, "yo");

  if (typeof puter === "undefined") {
    burbuja("No se pudo cargar el servicio de IA (Puter.js). Revisa la conexion: el script se baja de un servidor externo.", "aviso");
    return;
  }
  const destino = burbuja("", "ia");
  destino.innerHTML = '<span class="escribiendo">consultando...</span>';
  cargando = true; boton.disabled = true;

  const ms = [];
  if (historial.length === 0) ms.push({ role: "system", content: CONTEXTO });
  for (const m of historial) ms.push(m);
  ms.push({ role: "user", content: texto });

  try {
    const r = await puter.ai.chat(ms, { model: document.getElementById("modelo").value, stream: false });
    const salida = r.message.content || String(r);
    destino.textContent = salida;
    historial.push({ role: "user", content: texto }, { role: "assistant", content: salida });
  } catch (err) {
    destino.className = "msg aviso";
    destino.textContent = "La IA no respondio: " + (err && err.message ? err.message : err)
      + "\n\nPuede faltar iniciar sesion en Puter, o que el modelo no este disponible. Proba otro.";
  } finally {
    cargando = false; boton.disabled = false; entrada.focus();
  }
}
</script>
<script src="https://js.puter.com/v2/"></script>
</body>
</html>
