# ---------------------------------------------------------------------------
# PUBLICAR EL SITIO
#
# Que existiera una rama `gh-pages` hacia que todo pareciera roto sin explicacion:
# Pages servia esa rama, uno editaba `main`, y los cambios no se veian nunca.
# El sintoma era desconcertante: el commit estaba en GitHub, el raw tenia los
# cambios, y la web servia la version vieja.
#
# Este workflow elimina esa clase de problema: cada push a `main` recompone
# `web/` y lo publica. Lo que esta en `web/` es exactamente lo que se sirve,
# sin rama intermedia que se pueda desincronizar.
#
# Tambien evita tener que pulsar "Deploy" a mano en Settings > Pages, que es
# lo que hacia falta cada vez.
#
# Requiere que en Settings > Pages la fuente sea "GitHub Actions".
# ---------------------------------------------------------------------------
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes juntos, se cancela el anterior: el ultimo gana.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    # `actions/deploy-pages` EXIGE este bloque. Sin el, falla con
    # "HttpError: Missing environment. Ensure your workflow's deployment job
    # has an environment." Pasaron 3 corridas fallidas por esto, el 30/09/2026.
    # Declararlo aqui evita depender de que el environment exista por
    #timestamp de cuando se cambio la fuente de Pages.
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Desplegar en GitHub Pages
        id: desplegar
        uses: actions/deploy-pages@v4